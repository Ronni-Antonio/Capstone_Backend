name: Deploy Backend

on:
  workflow_run:
    workflows:
      - "Backend CI"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest
    environment: production

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ============================================================
      # SSH
      # ============================================================

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -T 15 -H "$EC2_HOST" \
            >> ~/.ssh/known_hosts

      # ============================================================
      # PREPARE SERVER DIRECTORY
      # ============================================================

      - name: Prepare application directory on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" '
              set -e

              sudo mkdir -p \
                /var/www/plink-backend/PLink

              sudo chown -R \
                "$USER":"$USER" \
                /var/www/plink-backend
            '

      # ============================================================
      # RSYNC BACKEND
      # ============================================================

      - name: Upload Laravel, Prophet and CNN application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            \
            --exclude='ml_service/venv/' \
            --exclude='ml_service/cnn_venv/' \
            --exclude='ml_service/__pycache__/' \
            --exclude='ml_service/saved_models/' \
            --exclude='ml_service/models/' \
            \
            -e "ssh -i ~/.ssh/ec2_key" \
            PLink/ \
            "$EC2_USER@$EC2_HOST:/var/www/plink-backend/PLink/"

      # ============================================================
      # DEPLOY
      # ============================================================

      - name: Install and deploy backend services on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            'bash -s' < deployment/deploy-remote.sh
