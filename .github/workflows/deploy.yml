name: Deploy Backend

on:
  workflow_run:
    workflows:
      - "Backend CI"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Prepare application directory on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" '
            sudo mkdir -p /var/www/plink-backend/PLink &&
            sudo chown -R "$USER":"$USER" /var/www/plink-backend
          '

      - name: Upload Laravel and Prophet application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='ml_service/venv/' \
            --exclude='ml_service/__pycache__/' \
            --exclude='ml_service/saved_models/' \
            -e "ssh -i ~/.ssh/ec2_key" \
            PLink/ "$EC2_USER@$EC2_HOST:/var/www/plink-backend/PLink/"

      - name: Install and deploy Laravel and Prophet on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" '
            set -e
            cd /var/www/plink-backend/PLink

            test -f .env || { echo "ERROR: production .env is missing"; exit 1; }
            command -v python3 >/dev/null || { echo "ERROR: python3 is not installed on EC2"; exit 1; }

            echo "Installing Laravel dependencies..."
            composer install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader \
              --no-interaction \
              --no-progress

            echo "Running database migrations..."
            php artisan migrate --force

            echo "Refreshing Laravel caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Fixing Laravel writable-directory permissions..."
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R ug+rwX storage bootstrap/cache

            echo "Preparing Prophet virtual environment..."
            cd /var/www/plink-backend/PLink/ml_service
            if [ ! -x venv/bin/python ]; then
              python3 -m venv venv
            fi
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
            mkdir -p saved_models

            echo "Installing Prophet systemd service..."
            sudo cp /var/www/plink-backend/PLink/deployment/systemd/plink-prophet.service /etc/systemd/system/plink-prophet.service
            sudo systemctl daemon-reload
            sudo systemctl enable plink-prophet
            sudo systemctl restart plink-prophet

            echo "Installing Laravel scheduler cron entry..."
            sudo cp /var/www/plink-backend/PLink/deployment/cron/plink-scheduler /etc/cron.d/plink-scheduler
            sudo chown root:root /etc/cron.d/plink-scheduler
            sudo chmod 644 /etc/cron.d/plink-scheduler

            cd /var/www/plink-backend/PLink
            php artisan queue:restart || true
            sudo systemctl reload nginx

            echo "Checking Prophet service..."
            sleep 2
            curl --fail --silent http://127.0.0.1:5001/health >/dev/null

            echo "Deployment completed successfully."
          '
